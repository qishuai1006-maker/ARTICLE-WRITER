<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>零冷水真实安装红圈封面</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
      background: #d8d6d0;
      color: #111;
    }
    .canvas {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #d8d6d0;
    }
    .bg {
      position: absolute;
      inset: -110px -80px;
      background-image: url("/var/folders/vk/l2cr9ymx79gbjfkkprtm3w740000gn/T/codex-clipboard-eb764ea2-0278-442d-8bb9-f48c82554334.png");
      background-size: cover;
      background-position: center 45%;
      filter: blur(16px) saturate(0.9) brightness(0.78);
      transform: scale(1.05);
    }
    .photo {
      position: absolute;
      left: 82px;
      top: 0;
      width: 720px;
      height: 900px;
      background: #ddd;
      box-shadow: 22px 0 70px rgba(0,0,0,0.22);
      overflow: hidden;
    }
    .photo img {
      position: absolute;
      width: 720px;
      height: 960px;
      object-fit: cover;
      object-position: 50% 42%;
      left: 0;
      top: -30px;
    }
    .wash {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.10), rgba(255,255,255,0.08));
      pointer-events: none;
    }
    .mask {
      position: absolute;
      border-radius: 10px;
      background: rgba(202, 199, 188, 0.96);
      filter: blur(0.2px);
    }
    .logo-mask { left: 214px; top: 72px; width: 152px; height: 52px; }
    .label-mask { left: 444px; top: 48px; width: 190px; height: 178px; }
    .qr-mask { left: 216px; top: 490px; width: 92px; height: 66px; }
    .pipe-circle {
      position: absolute;
      left: 234px;
      top: 628px;
      width: 328px;
      height: 156px;
      border: 16px solid #e92323;
      border-radius: 52% 48% 50% 54%;
      transform: rotate(-5deg);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.45), 0 8px 16px rgba(180,0,0,0.22);
    }
    .pipe-circle:after {
      content: "";
      position: absolute;
      right: -35px;
      top: 50px;
      width: 62px;
      height: 16px;
      background: #e92323;
      border-radius: 999px;
      transform: rotate(-12deg);
    }
    .hand-note {
      position: absolute;
      left: 382px;
      top: 562px;
      color: #e92323;
      font-size: 58px;
      font-weight: 950;
      letter-spacing: 1px;
      transform: rotate(-5deg);
      text-shadow:
        3px 3px 0 #fff,
        -3px 3px 0 #fff,
        3px -3px 0 #fff,
        -3px -3px 0 #fff,
        0 8px 18px rgba(0,0,0,0.26);
    }
    .arrow {
      position: absolute;
      left: 532px;
      top: 618px;
      width: 128px;
      height: 18px;
      background: #e92323;
      border-radius: 999px;
      transform: rotate(20deg);
      box-shadow: 0 4px 10px rgba(180,0,0,0.25);
    }
    .arrow:after {
      content: "";
      position: absolute;
      right: -22px;
      top: -15px;
      border-left: 34px solid #e92323;
      border-top: 24px solid transparent;
      border-bottom: 24px solid transparent;
    }
    .right-panel {
      position: absolute;
      left: 720px;
      top: 0;
      width: 880px;
      height: 900px;
      background:
        linear-gradient(90deg, rgba(244,244,239,0.06), rgba(244,244,239,0.86) 26%, rgba(246,246,241,0.96) 100%);
    }
    .right-panel:before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.035) 0 2px, transparent 2px 146px);
      opacity: 0.5;
    }
    .headline-wrap {
      position: absolute;
      left: 560px;
      top: 142px;
      width: 980px;
      text-align: center;
      transform: rotate(-1.5deg);
    }
    .headline {
      display: inline-block;
      width: 100%;
      font-size: 92px;
      line-height: 1.12;
      font-weight: 950;
      letter-spacing: -1px;
      color: #101010;
      -webkit-text-stroke: 3px #e92323;
      paint-order: stroke fill;
      text-shadow:
        5px 5px 0 rgba(255,255,255,0.92),
        0 14px 28px rgba(0,0,0,0.18);
    }
    .headline .line {
      display: block;
      white-space: nowrap;
    }
    .red-brush {
      position: absolute;
      left: 662px;
      top: 530px;
      width: 760px;
      height: 24px;
      background: #e92323;
      border-radius: 999px;
      transform: rotate(-1.8deg);
      opacity: 0.88;
      box-shadow: 0 7px 14px rgba(180,0,0,0.18);
    }
    .sub {
      position: absolute;
      left: 670px;
      top: 586px;
      width: 730px;
      font-size: 42px;
      line-height: 1.35;
      color: #1f2937;
      font-weight: 850;
      text-align: center;
      text-shadow: 0 2px 0 rgba(255,255,255,0.9);
    }
    .tag {
      position: absolute;
      right: 92px;
      bottom: 78px;
      padding: 20px 34px;
      border-radius: 999px;
      background: #e92323;
      color: #fff;
      font-size: 40px;
      font-weight: 950;
      box-shadow: 0 16px 32px rgba(180,0,0,0.25);
      transform: rotate(-2deg);
    }
    .mini-pipe {
      position: absolute;
      right: 112px;
      top: 584px;
      width: 270px;
      height: 112px;
      opacity: 0.7;
    }
    .mini-pipe div {
      position: absolute;
      background: rgba(233,35,35,0.80);
      border-radius: 999px;
    }
    .mini-pipe .p1 { left: 0; top: 44px; width: 220px; height: 12px; }
    .mini-pipe .p2 { left: 208px; top: 44px; width: 12px; height: 66px; }
    .mini-pipe .p3 { left: 208px; top: 98px; width: 62px; height: 12px; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="bg"></div>
    <section class="photo">
      <img src="/var/folders/vk/l2cr9ymx79gbjfkkprtm3w740000gn/T/codex-clipboard-eb764ea2-0278-442d-8bb9-f48c82554334.png" alt="燃气热水器真实安装图">
      <div class="wash"></div>
      <div class="mask logo-mask"></div>
      <div class="mask label-mask"></div>
      <div class="mask qr-mask"></div>
      <div class="pipe-circle"></div>
      <div class="hand-note">没回水管！</div>
      <div class="arrow"></div>
    </section>
    <section class="right-panel"></section>
    <div class="headline-wrap">
      <div class="headline">
        <span class="line">零冷水别瞎装？</span>
        <span class="line">没回水管白花上千</span>
      </div>
    </div>
    <div class="red-brush"></div>
    <div class="sub">看起来是升级体验，<br>装错了就是多花冤枉钱</div>
    <div class="mini-pipe"><div class="p1"></div><div class="p2"></div><div class="p3"></div></div>
    <div class="tag">3类家庭才需要</div>
  </main>
</body>
</html>
