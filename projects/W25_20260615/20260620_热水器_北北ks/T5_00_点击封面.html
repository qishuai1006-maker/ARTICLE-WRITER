<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>热水器点击封面</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #eef5f3;
      color: #183238;
    }
    .cover {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 20%, rgba(92, 170, 165, .25), transparent 32%),
        linear-gradient(135deg, #f8fbf8 0%, #e8f2ef 46%, #d8e9e6 100%);
      padding: 78px 92px;
      display: grid;
      grid-template-columns: 1.02fr .98fr;
      gap: 54px;
      align-items: center;
    }
    .copy { z-index: 2; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      border: 2px solid rgba(31, 92, 95, .12);
      color: #285c60;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .eyebrow span {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #2b9a94;
      box-shadow: 26px 0 0 #f1b85f, 52px 0 0 #7aa7cb;
      margin-right: 52px;
    }
    h1 {
      margin: 44px 0 24px;
      font-size: 104px;
      line-height: 1.05;
      letter-spacing: 0;
      color: #17353a;
      max-width: 790px;
    }
    .sub {
      margin: 0;
      font-size: 42px;
      line-height: 1.42;
      color: #42636a;
      max-width: 760px;
      font-weight: 600;
    }
    .chips {
      margin-top: 54px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }
    .chip {
      padding: 18px 26px;
      border-radius: 22px;
      background: #ffffff;
      border: 2px solid rgba(30, 89, 95, .14);
      color: #244b50;
      font-size: 33px;
      font-weight: 800;
      box-shadow: 0 14px 34px rgba(35, 74, 79, .08);
    }
    .scene {
      position: relative;
      height: 760px;
      border-radius: 56px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.62)),
        linear-gradient(135deg, #dcebea, #ffffff);
      border: 3px solid rgba(33, 78, 84, .13);
      box-shadow: 0 34px 90px rgba(26, 67, 73, .17);
      overflow: hidden;
    }
    .tile-wall {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(41, 84, 90, .08) 2px, transparent 2px),
        linear-gradient(90deg, rgba(41, 84, 90, .08) 2px, transparent 2px);
      background-size: 92px 92px;
      opacity: .45;
    }
    .heater {
      position: absolute;
      right: 120px;
      top: 92px;
      width: 360px;
      height: 520px;
      border-radius: 44px;
      background: linear-gradient(145deg, #ffffff, #e3ecec);
      border: 5px solid #c8dbda;
      box-shadow: 0 26px 60px rgba(31, 71, 76, .17);
    }
    .heater::before {
      content: "";
      position: absolute;
      left: 70px;
      top: -84px;
      width: 220px;
      height: 96px;
      border-radius: 52px 52px 0 0;
      border: 24px solid #bacdca;
      border-bottom: 0;
    }
    .display {
      position: absolute;
      left: 58px;
      right: 58px;
      top: 96px;
      height: 116px;
      border-radius: 28px;
      background: #17353a;
      color: #d9fff9;
      display: grid;
      place-items: center;
      font-size: 58px;
      font-weight: 900;
    }
    .knobs {
      position: absolute;
      left: 70px;
      right: 70px;
      bottom: 82px;
      display: flex;
      justify-content: space-between;
    }
    .knobs span {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff, #a8bfbe);
      border: 4px solid #d3e0df;
    }
    .waterline {
      position: absolute;
      left: 88px;
      bottom: 158px;
      width: 500px;
      height: 118px;
      border-radius: 70px;
      background: rgba(255, 255, 255, .92);
      border: 3px solid rgba(44, 117, 125, .16);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px 30px;
      box-shadow: 0 18px 48px rgba(34, 74, 78, .11);
    }
    .drop {
      width: 54px;
      height: 72px;
      border-radius: 50% 50% 52% 52%;
      background: linear-gradient(180deg, #78c6d0, #2f8ea0);
      transform: rotate(45deg);
      flex: 0 0 auto;
    }
    .waterline b {
      font-size: 40px;
      color: #17353a;
      line-height: 1.1;
    }
    .note {
      position: absolute;
      right: 86px;
      bottom: 76px;
      width: 350px;
      padding: 24px 28px;
      border-radius: 28px;
      background: #fff9ea;
      color: #6b5422;
      font-size: 34px;
      line-height: 1.18;
      font-weight: 800;
      box-shadow: 0 18px 48px rgba(82, 64, 24, .12);
    }
  </style>
</head>
<body>
  <main class="cover" aria-label="热水器点击封面">
    <section class="copy">
      <div class="eyebrow"><span></span>普通家庭换热水器</div>
      <h1>别只看卖点<br>先看家里这5处</h1>
      <p class="sub">水温、水压、管路和安装位置，才是每天洗澡舒不舒服的关键。</p>
      <div class="chips">
        <div class="chip">水温稳不稳</div>
        <div class="chip">水压够不够</div>
        <div class="chip">管路远不远</div>
      </div>
    </section>
    <section class="scene" aria-hidden="true">
      <div class="tile-wall"></div>
      <div class="heater">
        <div class="display">42°C</div>
        <div class="knobs"><span></span><span></span></div>
      </div>
      <div class="waterline">
        <div class="drop"></div>
        <b>每天用水<br>小问题会放大</b>
      </div>
      <div class="note">安装条件<br>先问清</div>
    </section>
  </main>
</body>
</html>
