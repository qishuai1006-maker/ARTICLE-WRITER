<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>1.5P 各价位推荐 + 外机重量避坑</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#eef1f6; }
  body { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
         color:#1a1a1a; padding:40px 0; width:1080px; }
  .wrap { width:1000px; margin:0 auto; }
  .head { text-align:center; margin-bottom:24px; }
  .head h1 { font-size:40px; font-weight:800; color:#0f172a; }
  .head .sub { font-size:16px; color:#64748b; margin-top:8px; }
  table { width:100%; border-collapse:collapse; background:#fff;
          border-radius:14px; overflow:hidden; box-shadow:0 4px 16px rgba(15,23,42,.10); }
  th, td { padding:16px 14px; text-align:center; font-size:16px; border-bottom:1px solid #eef0f3; }
  th { background:#0f172a; color:#fff; font-weight:600; font-size:15px; }
  td.model { font-weight:700; color:#0f172a; text-align:left; }
  td.price { font-weight:800; color:#2563eb; white-space:nowrap; }
  td.apf { font-weight:800; color:#059669; }
  .badge { display:inline-block; background:#dcfce7; color:#065f46; font-size:13px;
           font-weight:700; padding:4px 10px; border-radius:7px; }
  .tip { margin-top:22px; display:flex; gap:16px; }
  .card { flex:1; border-radius:14px; padding:20px 24px; box-shadow:0 4px 16px rgba(15,23,42,.10); }
  .good { background:#eff6ff; border-left:6px solid #2563eb; }
  .bad  { background:#fef2f2; border-left:6px solid #ef4444; }
  .card b { font-size:20px; display:block; }
  .good b { color:#1e3a8a; } .bad b { color:#991b1b; }
  .card p { font-size:15px; color:#475569; margin-top:8px; line-height:1.55; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>1.5 匹各价位 · 内行推荐清单</h1>
    <div class="sub">价格含国补 · 参数核对自京东 · APF 越高越省电</div>
  </div>

  <table>
    <tr>
      <th>预算档</th><th>首推型号</th><th>APF</th><th>核心卖点</th>
    </tr>
    <tr>
      <td class="price">¥2000 档</td>
      <td class="model">华凌神机二代 Pro</td>
      <td class="apf">6.02</td>
      <td><span class="badge">30kg 外机满配</span></td>
    </tr>
    <tr>
      <td class="price">¥2200 档</td>
      <td class="model">小米巨省电 Pro</td>
      <td class="apf">6.30</td>
      <td><span class="badge">APF 行业顶尖</span></td>
    </tr>
    <tr>
      <td class="price">~¥3000 档</td>
      <td class="model">美的全面风 Pro</td>
      <td class="apf">—</td>
      <td><span class="badge">180° 旋转无风感</span></td>
    </tr>
    <tr>
      <td class="price">¥2100 / 2549</td>
      <td class="model">格力天仪 / 云佳 Pro</td>
      <td class="apf">—</td>
      <td><span class="badge">整机十年包修</span></td>
    </tr>
  </table>

  <div class="tip">
    <div class="card good">
      <b>✅ 外机 ≥ 30kg = 满配</b>
      <p>双排铜管加电子膨胀阀，冷凝器没偷工，扛得住极端工况</p>
    </div>
    <div class="card bad">
      <b>❌ 外机 ≤ 26kg = 缩水</b>
      <p>大概率冷凝器砍了排数，监狱机位夏天容易热保护停机</p>
    </div>
  </div>
</div>
</body>
</html>
